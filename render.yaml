# Wedding OS on Render. One Node web service for the API; the web app is static (Vercel, see vercel.json, or the static
# site below). Secrets are never in this file: Render asks for each `sync: false` value when the Blueprint is created.
#
# IMPORTANT: this web service's disk is EPHEMERAL on the free plan. Weddings, vendors, workspace owners, proposals and
# planner history are JSON files under WEDDING_VAR_DIR and are lost on every restart or redeploy. For real customer data
# use a paid plan with a persistent disk (see the commented `disk` block) and read DEPLOYMENT.md. Inspiration photos must
# go to S3-compatible object storage (STORAGE_DRIVER=s3), never to this disk.
services:
  - type: web
    name: wedding-os-api
    runtime: node
    plan: free            # persistent disks need a paid plan (starter or above)
    region: singapore
    buildCommand: corepack enable && pnpm install --frozen-lockfile --prod=false
    startCommand: pnpm --filter @ave/server start
    healthCheckPath: /api/health
    # disk:               # uncomment with a paid plan, and set WEDDING_VAR_DIR to the mount path
    #   name: wedding-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render injects PORT; the server binds it (SERVER_PORT is only a fallback). Host must be 0.0.0.0.
      - key: SERVER_HOST
        value: 0.0.0.0
      # The web app's public address (CORS allow-list and links). Extra origins: CORS_ORIGINS=https://a.com,https://b.com
      - key: WEB_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: WEDDING_VAR_DIR
        value: /var/data
      - key: WEDDING_ADMIN_KEY
        sync: false
      # AI planner and AI design
      - key: OPENAI_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: WEDDING_VISION_MODEL
        sync: false
      # Feature flags
      - key: FLAGSMITH_ENVIRONMENT_KEY
        sync: false
      # Voice
      - key: SARVAM_API_KEY
        sync: false
      # Private object storage for inspiration photos
      - key: STORAGE_DRIVER
        value: s3
      - key: STORAGE_ENDPOINT
        sync: false
      - key: STORAGE_BUCKET
        sync: false
      - key: STORAGE_REGION
        sync: false
      - key: STORAGE_ACCESS_KEY_ID
        sync: false
      - key: STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: IMAGE_RETENTION_HOURS
        value: "24"
  # Optional: serve the web app from Render instead of Vercel. Set VITE_API_BASE_URL to the API's address (the API must
  # allow this site's origin through WEB_ORIGIN or CORS_ORIGINS).
  - type: web
    name: wedding-os-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @ave/web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        sync: false
